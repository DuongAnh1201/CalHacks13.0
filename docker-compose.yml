services:
  api:
    platform: linux/arm64
    build: ./backend
    image: brain3d-api:latest
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173
      - KEEP_JOBS=1
    volumes:
      - ./jobs:/app/jobs
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/src
          ignore:
            - "**/__pycache__/"
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock
        - action: rebuild
          path: ./backend/Dockerfile
    restart: unless-stopped
